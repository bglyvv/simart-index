:root{
  --ink:#3a1a52; --ink-2:#4d3d5c; --muted:#6b5a76;
  --purple:#5b2a7e; --purple-2:#6f3a96; --lilac:#a77bc9;
  --paper:#fdf8ee; --board:#e8c792; --board-2:#d6aa6a;
  --maroon:#8b2f3b;
  --u:1px;               /* 1 "design pixel" (GIF reference 1106x618), set by JS */
  --tw:200px; --th:267px; /* centre tile size, set by JS */
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:'Nunito',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;color:var(--ink);background:#efe3f1;overflow-x:hidden}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
a{color:inherit;text-decoration:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}

/* ---------- header ---------- */
.topbar{position:fixed;inset:0 0 auto;z-index:50;height:68px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;
  padding:0 clamp(16px,7.5vw,110px);background:rgba(250,244,250,.72);-webkit-backdrop-filter:blur(14px) saturate(1.2);backdrop-filter:blur(14px) saturate(1.2)}
.brand{justify-self:start;display:flex;align-items:center;gap:9px;font-weight:900;font-size:25px;letter-spacing:-.025em;color:#4b1f68}
.brand svg{width:33px;height:27px;flex:none}
.nav{display:flex;gap:4px}
.nav a,.nav button{display:flex;align-items:center;gap:6px;padding:9px 17px;border-radius:999px;font-weight:700;font-size:14.5px;color:#3b2450;transition:background .2s}
.nav a:hover,.nav button:hover{background:rgba(255,255,255,.7)}
.nav .active,.nav .active:hover{background:#fbe5b4}
.nav svg{width:11px;height:11px}
.actions{justify-self:end;display:flex;align-items:center;gap:14px}
.icon-btn{width:40px;height:40px;border-radius:50%;background:#fff;display:grid;place-items:center;box-shadow:0 3px 10px rgba(70,30,80,.08);transition:transform .2s}
.icon-btn:hover{transform:scale(1.06)}
.icon-btn svg{width:18px;height:18px}
.btn-login{background:var(--purple);color:#fff;font-weight:800;font-size:15px;padding:10px 25px;border-radius:999px;box-shadow:0 6px 16px rgba(91,42,126,.28);transition:background .2s,transform .2s}
.btn-login:hover{background:var(--purple-2);transform:translateY(-1px)}

/* ---------- journey / stage ---------- */
.journey{position:relative;height:800vh}
.stage{position:sticky;top:0;height:100vh;height:100svh;overflow:hidden;isolation:isolate}
.bg{position:absolute;inset:0;z-index:0;
  background:
    radial-gradient(48% 44% at 50% 63%,rgba(255,250,240,.95) 0%,rgba(255,248,242,.55) 45%,rgba(255,248,242,0) 75%),
    radial-gradient(130% 95% at 50% 0%,#f9f2f9 0%,#f1e5f3 55%,#e8d8ec 100%)}
.bg::after{content:'';position:absolute;inset:0;background:
    radial-gradient(30% 22% at 12% 30%,rgba(255,255,255,.55),transparent 70%),
    radial-gradient(28% 24% at 88% 34%,rgba(255,255,255,.5),transparent 70%)}

/* soft white platform that replaces the shelf during the journey */
.platform{position:absolute;left:0;right:0;bottom:0;z-index:1;opacity:0;pointer-events:none}
.platform::before{content:'';position:absolute;left:4%;right:4%;top:0;bottom:-40%;border-radius:50%;
  background:radial-gradient(50% 46% at 50% 38%,rgba(255,255,255,.95),rgba(255,252,246,.55) 55%,rgba(255,255,255,0) 78%)}
.platform::after{content:'';position:absolute;left:9%;right:9%;top:6%;height:70%;border-radius:50%;
  border-top:2px solid rgba(255,255,255,.85);box-shadow:inset 0 16px 34px rgba(255,255,255,.55);filter:blur(2px);
  -webkit-mask:linear-gradient(90deg,transparent,#000 22%,#000 78%,transparent);mask:linear-gradient(90deg,transparent,#000 22%,#000 78%,transparent)}

.hero{position:absolute;left:0;right:0;z-index:4;text-align:center;pointer-events:none;padding:0 16px}
.hero h1{margin:0;font-weight:900;letter-spacing:-.035em;line-height:1.08;color:#3a1a52;font-size:max(26px,min(calc(var(--u)*41),6.6vw))}
.hero p{margin:calc(var(--u)*10) 0 0;font-weight:600;color:#4a3a58;font-size:max(14px,calc(var(--u)*18))}

.shelf{position:absolute;z-index:2;overflow:visible;pointer-events:none}

/* ---------- arch of books ---------- */
.arc{position:absolute;inset:0;z-index:3}
.tile{position:absolute;left:0;top:0;width:var(--tw);height:var(--th);outline:none;
  transition:transform .75s cubic-bezier(.22,.8,.24,1),opacity .55s ease;will-change:transform;-webkit-tap-highlight-color:transparent}
.arc.no-anim .tile{transition:none}
.tile-in{position:absolute;inset:0;border-radius:calc(var(--u)*3) calc(var(--u)*8) calc(var(--u)*8) calc(var(--u)*3);
  box-shadow:0 calc(var(--u)*12) calc(var(--u)*20) rgba(70,35,70,.26),0 calc(var(--u)*2) calc(var(--u)*4) rgba(70,35,70,.18);
  transition:transform .38s cubic-bezier(.2,.8,.2,1),box-shadow .38s}
.tile-in img{display:block;width:100%;height:100%;object-fit:cover;border-radius:inherit;pointer-events:none;user-select:none;-webkit-user-drag:none}
.tile-in::before,.cover-front::before,.mini::before{content:'';position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:linear-gradient(90deg,rgba(0,0,0,.3) 0,rgba(255,255,255,.28) 1.4%,rgba(0,0,0,.16) 3.6%,rgba(255,255,255,.14) 5%,rgba(0,0,0,0) 8%),
             linear-gradient(180deg,rgba(255,255,255,.18),rgba(255,255,255,0) 32%)}
.tile:hover .tile-in,.tile:focus-visible .tile-in{transform:translateY(calc(var(--u)*-16)) scale(1.045);
  box-shadow:0 calc(var(--u)*24) calc(var(--u)*30) rgba(70,35,70,.3),0 calc(var(--u)*3) calc(var(--u)*6) rgba(70,35,70,.18)}
.tile.is-center .tile-in{box-shadow:0 0 0 calc(var(--u)*4) #fff3d8,0 0 calc(var(--u)*28) calc(var(--u)*7) rgba(255,200,110,.62),0 calc(var(--u)*18) calc(var(--u)*30) rgba(70,35,60,.3)}
.tile.is-center:hover .tile-in,.tile.is-center:focus-visible .tile-in{box-shadow:0 0 0 calc(var(--u)*4) #fff3d8,0 0 calc(var(--u)*36) calc(var(--u)*10) rgba(255,200,110,.75),0 calc(var(--u)*30) calc(var(--u)*36) rgba(70,35,60,.32)}
.tile.ghost{pointer-events:none}
.arc.handoff .tile.is-center{visibility:hidden}
.arc.locked .tile{pointer-events:none}

.arrow{position:absolute;z-index:6;left:0;top:0;width:max(38px,calc(var(--u)*46));height:max(38px,calc(var(--u)*46));border-radius:50%;background:#fff;
  display:grid;place-items:center;color:#2c1838;box-shadow:0 6px 18px rgba(60,30,70,.13);transition:box-shadow .2s,opacity .2s}
.arrow:hover{box-shadow:0 8px 24px rgba(60,30,70,.22)}
.arrow svg{width:38%;height:38%;transition:transform .15s}
.arrow:active svg{transform:scale(.82)}

.cta{position:absolute;left:0;right:0;z-index:6;display:flex;flex-direction:column;align-items:center;pointer-events:none}
.cta > *{pointer-events:auto}
.dots{display:flex;gap:max(6px,calc(var(--u)*7));height:max(7px,calc(var(--u)*8))}
.dots button{width:max(7px,calc(var(--u)*8));height:max(7px,calc(var(--u)*8));border-radius:50%;background:#cdb7cb;transition:background .3s,transform .3s}
.dots button.active{background:var(--purple)}
.dots button:hover{transform:scale(1.25)}
.btn-primary{display:inline-flex;align-items:center;justify-content:center;background:var(--purple);color:#fff;font-weight:800;border-radius:999px;
  font-size:max(14px,calc(var(--u)*15.5));padding:max(10px,calc(var(--u)*10.5)) max(24px,calc(var(--u)*30));
  box-shadow:0 8px 20px rgba(91,42,126,.28);transition:background .2s,transform .2s,box-shadow .2s}
.btn-primary:hover{background:var(--purple-2);transform:translateY(-2px);box-shadow:0 12px 26px rgba(91,42,126,.32)}
.cta .btn-primary{margin-top:max(18px,calc(var(--u)*24))}
.hint{margin-top:max(12px,calc(var(--u)*18));font-size:max(12.5px,calc(var(--u)*13.5));font-weight:600;color:#4f3e5c}
.hint span{display:inline-block;animation:nudge 1.8s ease-in-out infinite}
@keyframes nudge{50%{transform:translateY(3px)}}

.back-to{position:absolute;left:50%;bottom:max(18px,3.2vh);z-index:7;transform:translate(-50%,10px);opacity:0;pointer-events:none;transition:opacity .35s,transform .35s;
  background:rgba(255,255,255,.85);color:var(--purple);font-weight:800;font-size:14px;padding:10px 20px;border-radius:999px;box-shadow:0 6px 18px rgba(60,30,70,.12)}
.back-to.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}

/* ---------- 3D book ----------
   Coordinates: the spine sits on x = 0. Right-hand pages occupy x∈[0,W],
   flipped pages land on x∈[-W,0]. z = 0 is the table, +z is toward the viewer. */
.book-anchor{position:absolute;left:50%;top:0;width:0;height:0;z-index:5;pointer-events:none}
.book{position:absolute;left:0;top:calc(var(--H) * -.5);width:var(--W);height:var(--H);transform-style:preserve-3d;transform-origin:0 50% 0;visibility:hidden;
  --tR:0px;--tL:0px}
.book.interactive .store{pointer-events:auto}
.leaf{position:absolute;left:0;top:0;width:100%;height:100%;transform-style:preserve-3d;transform-origin:0 50% 0;--shade:0}
.face{position:absolute;-webkit-backface-visibility:hidden;backface-visibility:hidden;overflow:hidden}
.cover-front,.cover-back,.board,.backcover{left:0;top:0;width:100%;height:100%}
.cover-back,.backcover{transform:rotateY(180deg)}
.cover-back{background:linear-gradient(225deg,#efd4a2,#e2bb7c 55%,#d4a764);border-radius:calc(var(--bu)*.5) calc(var(--bu)*1.4) calc(var(--bu)*1.4) calc(var(--bu)*.5)}
/* free endpaper: a paper sheet that rides with the cover and settles on top of the left page stack */
.page.back.endsheet{transform:rotateY(180deg) translateZ(var(--es,.5px))}
.book.no-left .block-l,.book.no-right .block-r .sheet{visibility:hidden}
.board{transform:translateZ(.4px)}
.backcover{transform:rotateY(180deg) translateZ(.4px)}
.page{border-radius:0 calc(var(--bu)*1.2) calc(var(--bu)*1.2) 0;left:0;top:var(--mv);width:calc(var(--W) - var(--m));height:calc(var(--H) - 2 * var(--mv));color:#3b2c45;box-shadow:inset 0 0 0 .8px rgba(128,96,58,.45);
  background:linear-gradient(90deg,#e8d9bd 0,#f5ead6 3.2%,#fdf8ee 11%,#fcf6ea 90%,#f3e6cf 100%)}
.page.back{transform:rotateY(180deg);border-radius:calc(var(--bu)*1.2) 0 0 calc(var(--bu)*1.2);background:linear-gradient(270deg,#e8d9bd 0,#f5ead6 3.2%,#fdf8ee 11%,#fcf6ea 90%,#f3e6cf 100%)}
#pgPrice{transform:translateZ(var(--zb))}
/* turning shade */
.leaf .face::after{content:'';position:absolute;inset:0;pointer-events:none;opacity:var(--shade);
  background:linear-gradient(90deg,rgba(45,28,18,.42),rgba(45,28,18,.16) 45%,rgba(45,28,18,.05))}
.leaf .face.back::after,.leaf .cover-back::after{background:linear-gradient(270deg,rgba(45,28,18,.42),rgba(45,28,18,.16) 45%,rgba(45,28,18,.05))}
.base .face::after{display:none}

.cover-front{background:var(--cover) center/cover no-repeat;border-radius:calc(var(--bu)*.5) calc(var(--bu)*1.4) calc(var(--bu)*1.4) calc(var(--bu)*.5)}
.cover-front::after{display:none}
.board{background:linear-gradient(135deg,#efd4a2,#e2bb7c 55%,#d4a764);border-radius:calc(var(--bu)*.5) calc(var(--bu)*1.4) calc(var(--bu)*1.4) calc(var(--bu)*.5)}

/* page-block thickness */
.block-l,.block-r{position:absolute;inset:0;transform-style:preserve-3d;pointer-events:none}
.bf{position:absolute;-webkit-backface-visibility:hidden;backface-visibility:hidden}
/* fanned page stack: sheets under the top page whose edges peek out (outer side, top, bottom) */
.sheet{position:absolute;-webkit-backface-visibility:hidden;backface-visibility:hidden;
  top:calc(var(--mv) - var(--fy) * var(--k));height:calc(var(--H) - 2 * var(--mv) + var(--fy) * var(--k) * 2);
  box-shadow:inset 0 0 0 .8px rgba(128,96,58,.6),0 calc(var(--bu)*.2) calc(var(--bu)*.45) rgba(90,60,30,.14)}
.block-l .sheet{left:calc(var(--m) - var(--W) - var(--fxL) * var(--k));width:calc(var(--W) - var(--m) + var(--fxL) * var(--k));
  transform:translateZ(calc(var(--tL) * (1 - var(--k))));border-radius:calc(var(--bu)*1.5) 0 0 calc(var(--bu)*1.5);
  background:linear-gradient(90deg,#eadbbd,#f6ecd8 5%,#fbf5e8)}
.block-r .sheet{left:0;width:calc(var(--W) - var(--m) + var(--fxR) * var(--k));
  transform:translateZ(calc(var(--tR) * (1 - var(--k))));border-radius:0 calc(var(--bu)*1.5) calc(var(--bu)*1.5) 0;
  background:linear-gradient(270deg,#eadbbd,#f6ecd8 5%,#fbf5e8)}
.bf.bottom{transform-origin:50% 100%;transform:rotateX(-90deg);
  background:linear-gradient(0deg,rgba(150,115,70,.18),rgba(255,255,255,0) 60%),repeating-linear-gradient(0deg,#f6ecd9 0 1.6px,#e3d2b3 1.6px 2.6px)}
.bf.outer{background:linear-gradient(90deg,rgba(150,115,70,.16),rgba(255,255,255,0) 60%),repeating-linear-gradient(90deg,#f6ecd9 0 1.6px,#e3d2b3 1.6px 2.6px)}
.block-r .bottom{left:0;top:calc(var(--H) - var(--mv) - var(--tR));width:calc(var(--W) - var(--m));height:var(--tR)}
.block-r .outer{left:calc(var(--W) - var(--m) - var(--tR));top:var(--mv);width:var(--tR);height:calc(var(--H) - 2 * var(--mv));transform-origin:100% 50%;transform:rotateY(90deg)}
.block-l .bottom{left:calc(var(--m) - var(--W));top:calc(var(--H) - var(--mv) - var(--tL));width:calc(var(--W) - var(--m));height:var(--tL)}
.block-l .outer{left:calc(var(--m) - var(--W));top:var(--mv);width:var(--tL);height:calc(var(--H) - 2 * var(--mv));transform-origin:0 50%;transform:rotateY(-90deg)}
.spine{position:absolute;top:0;height:100%;width:calc(var(--D) + var(--c));-webkit-backface-visibility:hidden;backface-visibility:hidden;border-radius:calc(var(--bu)*.6);
  background:linear-gradient(90deg,#c99a5d,#ecd1a0 30%,#fbefd2 52%,#e6c48c 75%,#c1914f)}
.spine-front{left:0;transform-origin:0 50%;transform:rotateY(-90deg)}
.spine-back{left:calc(-1 * (var(--D) + var(--c)));transform-origin:100% 50%;transform:rotateY(90deg)}

/* ---------- page content (sized in book units: --bu = 1% of book height) ---------- */
.pin{position:absolute;inset:0;padding:calc(var(--bu)*9) calc(var(--bu)*8) calc(var(--bu)*8) calc(var(--bu)*9);display:flex;flex-direction:column;justify-content:center}
.page.back .pin{padding:calc(var(--bu)*9) calc(var(--bu)*9) calc(var(--bu)*8) calc(var(--bu)*8)}
.page h2{margin:0;font-weight:900;letter-spacing:-.025em;line-height:1.08;color:#331846;font-size:calc(var(--bu)*6.4)}
.page p{margin:0;font-size:calc(var(--bu)*3.55);line-height:1.5;font-weight:600}
.sprig{position:absolute;width:calc(var(--bu)*11);height:auto;pointer-events:none}

/* title page */
.t-page{align-items:center;text-align:center;gap:calc(var(--bu)*3)}
.t-page .kicker{font-size:calc(var(--bu)*2.6);letter-spacing:.24em;text-transform:uppercase;font-weight:800;color:#a08a74}
.t-page h2{font-size:calc(var(--bu)*8);color:#341a49;text-wrap:balance}
.t-page .by{font-size:calc(var(--bu)*3.2);font-weight:700;color:#7a6676}
.orn{width:calc(var(--bu)*24);height:auto}

/* endpaper */
.endpaper{position:absolute;inset:0;
  background-color:#fbf3e3;
  background-image:radial-gradient(circle,rgba(var(--accent-rgb),.22) 0 calc(var(--bu)*.55),transparent calc(var(--bu)*.65)),
                   radial-gradient(circle,rgba(var(--accent-rgb),.12) 0 calc(var(--bu)*.9),transparent calc(var(--bu)*1)),
                   linear-gradient(270deg,rgba(120,90,50,.18),rgba(0,0,0,0) 9%);
  background-size:calc(var(--bu)*7) calc(var(--bu)*7),calc(var(--bu)*14) calc(var(--bu)*14),100% 100%;
  background-position:0 0,calc(var(--bu)*3.5) calc(var(--bu)*3.5),0 0;display:grid;place-items:center}
.exlibris{width:62%;padding:calc(var(--bu)*4) calc(var(--bu)*4) calc(var(--bu)*3.2);background:#fffaf1;border-radius:calc(var(--bu)*2.4);text-align:center;
  border:calc(var(--bu)*.35) solid rgba(var(--accent-rgb),.35);box-shadow:0 calc(var(--bu)*1) calc(var(--bu)*3) rgba(80,50,30,.12)}
.exlibris svg{width:calc(var(--bu)*8);height:auto}
.exlibris b{display:block;font-size:calc(var(--bu)*3.6);font-weight:900;color:#3a1a52;margin-top:calc(var(--bu)*1.4)}
.exlibris i{display:block;height:calc(var(--bu)*.3);margin:calc(var(--bu)*5) calc(var(--bu)*2) calc(var(--bu)*1.6);background:repeating-linear-gradient(90deg,rgba(var(--accent-rgb),.45) 0 calc(var(--bu)*1),transparent calc(var(--bu)*1) calc(var(--bu)*1.8))}
.exlibris small{font-size:calc(var(--bu)*2.6);font-weight:700;color:#8a7686}

/* author page */
.a-page{justify-content:flex-start;padding-top:calc(var(--bu)*10)}
.avatar{width:calc(var(--bu)*27);height:calc(var(--bu)*27);border-radius:50%;overflow:hidden;flex:none;
  box-shadow:0 0 0 calc(var(--bu)*1) #fff,0 calc(var(--bu)*1) calc(var(--bu)*3) rgba(80,50,30,.2)}
.avatar svg{display:block;width:100%;height:100%}
.a-page .label{margin-top:calc(var(--bu)*6);font-size:calc(var(--bu)*3.3);font-weight:700;color:#5b4a66}
.a-page h2{font-size:calc(var(--bu)*5.6);margin-top:calc(var(--bu)*.6)}
.a-page p{margin-top:calc(var(--bu)*4.2);font-size:calc(var(--bu)*3.75)}

/* illustration pages */
.illus{position:absolute;top:calc(var(--bu)*8);bottom:calc(var(--bu)*8);left:calc(var(--bu)*6);right:calc(var(--bu)*7);border-radius:calc(var(--bu)*3.5);overflow:hidden;
  box-shadow:0 0 0 calc(var(--bu)*.5) rgba(255,255,255,.85),0 calc(var(--bu)*1) calc(var(--bu)*3.5) rgba(80,50,30,.2)}
.illus i{position:absolute;inset:0;background:var(--cover) no-repeat;background-size:var(--size) auto;background-position:var(--pos)}
.illus.flip i{transform:scaleX(-1)}
.illus::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,.12),rgba(255,255,255,0) 40%);pointer-events:none}

/* about page */
.ab-page{justify-content:flex-start;padding-top:calc(var(--bu)*12)}
.ab-page p{margin-top:calc(var(--bu)*4)}
.meta{list-style:none;margin:calc(var(--bu)*6) 0 0;padding:0;display:grid;gap:calc(var(--bu)*3.2)}
.meta li{display:flex;align-items:center;gap:calc(var(--bu)*2.6);font-size:calc(var(--bu)*3.7);font-weight:600}
.meta b{font-weight:900;color:#331846}
.meta svg{width:calc(var(--bu)*5.2);height:calc(var(--bu)*5.2);flex:none;color:var(--maroon)}

/* mini-cover page */
.m-page{align-items:center}
.mini{position:relative;width:calc(var(--bu)*44);aspect-ratio:3/4;background:var(--cover) center/cover no-repeat;border-radius:calc(var(--bu)*.5) calc(var(--bu)*1.4) calc(var(--bu)*1.4) calc(var(--bu)*.5);
  box-shadow:calc(var(--bu)*.5) calc(var(--bu)*.6) 0 #f6ead3,calc(var(--bu)*1) calc(var(--bu)*1.2) 0 #e6d3b0,calc(var(--bu)*1.4) calc(var(--bu)*1.8) 0 #d8bf92,calc(var(--bu)*2.5) calc(var(--bu)*4) calc(var(--bu)*5) rgba(70,40,20,.32)}

/* price page */
.pr-page{justify-content:flex-start;padding-top:calc(var(--bu)*12)}
.pr-page h3{margin:0;font-size:calc(var(--bu)*5);font-weight:900;color:#331846}
.price{align-self:flex-start;margin-top:calc(var(--bu)*3);padding:calc(var(--bu)*1.5) calc(var(--bu)*5.5);border-radius:calc(var(--bu)*3);
  background:linear-gradient(180deg,#b88fd6,#9a6ec2);color:#fff;font-weight:800;font-size:calc(var(--bu)*6.2);letter-spacing:-.01em;
  box-shadow:inset 0 calc(var(--bu)*.4) 0 rgba(255,255,255,.3),0 calc(var(--bu)*1) calc(var(--bu)*2.5) rgba(110,60,150,.28)}
.pr-page h4{margin:calc(var(--bu)*6.5) 0 0;font-size:calc(var(--bu)*3.9);font-weight:800;color:#331846}
.stores{margin-top:calc(var(--bu)*2.8);background:#fff;border-radius:calc(var(--bu)*2.4);box-shadow:0 calc(var(--bu)*.8) calc(var(--bu)*3) rgba(80,50,30,.12);overflow:hidden}
.store{display:flex;align-items:center;gap:calc(var(--bu)*2.4);padding:calc(var(--bu)*2.5) calc(var(--bu)*3.2);font-weight:800;font-size:calc(var(--bu)*3.9);color:#2d1d38;pointer-events:none;transition:background .2s}
.store + .store{border-top:1px solid #efe6db}
.store:hover{background:#fbf5ff}
.store .s-ic{width:calc(var(--bu)*5.2);height:calc(var(--bu)*5.2);color:var(--c);flex:none}
.store .s-name{flex:1;color:var(--t,#2d1d38)}
.store .s-ext{width:calc(var(--bu)*3.8);height:calc(var(--bu)*3.8);color:#3a2a44;flex:none}

/* back cover */
.backcover{background:#f4e9d4;border-radius:calc(var(--bu)*1.4) calc(var(--bu)*.5) calc(var(--bu)*.5) calc(var(--bu)*1.4)}
.bc-art{position:absolute;inset:0}
.bc-art svg{display:block;width:100%;height:100%}
.bc-art.photo{background-position:center;background-size:cover}
.bc-quote{position:absolute;left:10%;right:10%;top:20%;text-align:center;display:flex;flex-direction:column;align-items:center;gap:calc(var(--bu)*3)}
.bc-quote p{margin:0;font-size:calc(var(--bu)*4.8);line-height:1.35;font-weight:700;color:var(--qc,#2f2235);text-wrap:balance;text-shadow:0 0 calc(var(--bu)*2) var(--qg,rgba(255,250,240,.9))}
.bc-quote .orn{width:calc(var(--bu)*16)}
.bc-brand{position:absolute;left:7%;bottom:6%;display:flex;align-items:center;gap:calc(var(--bu)*1.2);font-weight:900;font-size:calc(var(--bu)*3.6);color:#4b1f68;
  background:rgba(255,255,255,.85);padding:calc(var(--bu)*1.1) calc(var(--bu)*2.2);border-radius:999px}
.bc-brand svg{width:calc(var(--bu)*4.6);height:auto}
.barcode{position:absolute;right:7%;bottom:6%;width:30%;background:#fff;padding:calc(var(--bu)*1.2) calc(var(--bu)*1.6) calc(var(--bu)*.6);border-radius:calc(var(--bu)*.8)}
.barcode svg{display:block;width:100%;height:auto}

/* ---------- footer ---------- */
.footer{position:relative;background:#fff;text-align:center;padding:90px 20px 70px}
.footer h2{margin:14px 0 10px;font-size:clamp(28px,4vw,40px);font-weight:900;letter-spacing:-.03em}

(() => {
'use strict';

/* decorative barcode from the book code */
function barcode(code) {
  let s = 0; for (const ch of code) s = (s * 31 + ch.charCodeAt(0)) >>> 0;
  const rnd = () => (s = (s * 1664525 + 1013904223) >>> 0) / 4294967296;
  let x = 3, bars = '', i = 0;
  const guard = x0 => { bars += `<rect x="${x0}" y="0" width="1" height="38"/><rect x="${x0 + 2}" y="0" width="1" height="38"/>`; };
  guard(3); x = 7;
  while (x < 88) {
    const w = .8 + Math.floor(rnd() * 3) * .75;
    if (i++ % 2 === 0) bars += `<rect x="${x.toFixed(2)}" y="0" width="${w.toFixed(2)}" height="33"/>`;
    x += w + (Math.abs(x - 46) < 1.2 ? 2 : 0);
  }
  guard(90);
  const d = code.replace(/\D/g, '');
  return `<svg viewBox="0 0 96 46" aria-hidden="true"><g fill="#1d1620">${bars}</g>
    <text x="48" y="44.5" font-size="7" text-anchor="middle" font-family="Nunito,sans-serif" font-weight="700" fill="#1d1620" letter-spacing=".6">${d.slice(0,3)} ${d.slice(3,7)} ${d.slice(7)}</text></svg>`;
}

/* signed offset of book i from the selected one, wrapped around the ring */
function offsetOf(i, sel = selected) {
  let k = ((i - sel) % N + N) % N;
  if (k > N / 2) k -= N;
  return k;
}
function standY(dxRef) { const R = REF.shelf.R; return REF.shelf.apex + REF.stand + (R - Math.sqrt(R * R - dxRef * dxRef)); }
function pose(k) {
  const a = Math.min(Math.abs(k), 3), sg = Math.sign(k) || 0;
  const u = G.u;
  if (a === 0) return { x: G.ox + REF.cx * u, y: G.oy + REF.center.y * u, s: 1, r: 0, o: 1, z: 10 };
  const sl = REF.slots[a];
  const cy = standY(sl.dx) - sl.h / 2;
  return { x: G.ox + (REF.cx + sg * sl.dx * G.dxScale) * u, y: G.oy + cy * u, s: sl.h / REF.center.h, r: sg * sl.rot,
           o: a <= VISIBLE_SIDE ? 1 : 0, z: 10 - a };
}
function applyPose(t, P) {
  t.style.transform = `translate3d(${P.x.toFixed(2)}px,${P.y.toFixed(2)}px,0) translate(-50%,-50%) rotate(${P.r}deg) scale(${P.s.toFixed(4)})`;
  t.style.opacity = P.o; t.style.zIndex = P.z;
}

function layoutTiles(dir = 0) {
  tiles.forEach((t, i) => {
    const k = offsetOf(i), prev = t._k;
    t.classList.toggle('is-center', k === 0);
    t.tabIndex = Math.abs(k) <= VISIBLE_SIDE ? 0 : -1;
    t.setAttribute('aria-hidden', Math.abs(k) <= VISIBLE_SIDE ? 'false' : 'true');
    const wrapped = dir && prev !== undefined && Math.abs(k - prev) > N / 2;
    if (wrapped) {
      // a book leaving one end re-enters at the other end: a ghost copy exits, the real one slides in
      if (Math.abs(prev) <= VISIBLE_SIDE && !reduceMotion) spawnGhost(t, prev, dir > 0 ? -3 : 3);
      t.style.transition = 'none';
      applyPose(t, { ...pose(dir > 0 ? 3 : -3), o: 0 });
      t.offsetWidth; // reflow so the jump is not animated
      t.style.transition = '';
    }
    applyPose(t, pose(k));
    t._k = k;
  });
  dots.forEach((d, i) => { d.classList.toggle('active', i === selected); d.setAttribute('aria-selected', i === selected); });
}
function spawnGhost(t, fromK, toK) {
  const g = t.cloneNode(true);
  g.classList.add('ghost'); g.classList.remove('is-center'); g.removeAttribute('aria-label'); g.tabIndex = -1;
  g.style.transition = 'none'; applyPose(g, pose(fromK));
  arc.appendChild(g); g.offsetWidth; g.style.transition = '';
  applyPose(g, { ...pose(toK), o: 0 });
  setTimeout(() => g.remove(), 800);
}
function select(i) {
  i = ((i % N) + N) % N;
  if (i === selected) return;
  let d = i - selected; if (d > N / 2) d -= N; if (d < -N / 2) d += N;
  selected = i;
  layoutTiles(Math.sign(d));
  fillBook(selected);
  live.textContent = BOOKS[selected].title;
}
const shift = d => select(selected + d);
prevBtn.addEventListener('click', () => shift(-1));
nextBtn.addEventListener('click', () => shift(1));
document.addEventListener('keydown', e => {
  if (shown > .02 || e.altKey || e.ctrlKey || e.metaKey) return;
  if (e.key === 'ArrowLeft') { shift(-1); e.preventDefault(); }
  if (e.key === 'ArrowRight') { shift(1); e.preventDefault(); }
});
/* swipe on the arch (touch & mouse drag) */
let swX = null, swiped = false;
arc.addEventListener('pointerdown', e => { swX = e.clientX; swiped = false; });
addEventListener('pointerup', e => {
  if (swX === null) return;
  const dx = e.clientX - swX; swX = null;
  if (Math.abs(dx) > 45) { swiped = true; shift(dx < 0 ? 1 : -1); setTimeout(() => swiped = false, 50); }
});

/* ============================================================ SHELF SVG */
function arcPath(yApex, x0, x1, R) {           // y of a circular arc's end points, given its apex
  const h = (x1 - x0) / 2;
  return { y: yApex + (R - Math.sqrt(R * R - h * h)) };
}
function buildShelf() {
  const S = REF.shelf, x0 = S.x0, x1 = S.x1, R = S.R;
  const back = arcPath(S.apex, x0, x1, R), ftop = arcPath(S.apex + S.depth, x0, x1, R), fbot = arcPath(S.apex + S.depth + S.front, x0, x1, R);
  const body = `M${x0} ${back.y} A${R} ${R} 0 0 1 ${x1} ${back.y} C${x1 + 9} ${back.y + 4} ${x1 + 9} ${fbot.y - 4} ${x1} ${fbot.y} A${R} ${R} 0 0 0 ${x0} ${fbot.y} C${x0 - 9} ${fbot.y - 4} ${x0 - 9} ${back.y + 4} ${x0} ${back.y}Z`;
  const top = `M${x0} ${back.y} A${R} ${R} 0 0 1 ${x1} ${back.y} C${x1 + 7} ${back.y + 3} ${x1 + 7} ${ftop.y - 3} ${x1} ${ftop.y} A${R} ${R} 0 0 0 ${x0} ${ftop.y} C${x0 - 7} ${ftop.y - 3} ${x0 - 7} ${back.y + 3} ${x0} ${back.y}Z`;
  const shadow = `M${x0 + 20} ${fbot.y + 4} A${R} ${R} 0 0 1 ${x1 - 20} ${fbot.y + 4} L${x1 - 30} ${fbot.y + 26} A${R} ${R} 0 0 0 ${x0 + 30} ${fbot.y + 26}Z`;
  const hl = `M${x0 + 6} ${ftop.y - .5} A${R} ${R} 0 0 1 ${x1 - 6} ${ftop.y - .5}`;
  $('shelfGroup').innerHTML = `<path d="${shadow}" fill="#6b3f6e" opacity=".22" filter="url(#shBlur)"/>
    <path d="${body}" fill="url(#shFront)"/><path d="${body}" fill="url(#shSide)"/><path d="${top}" fill="url(#shTop)"/>
    <path d="${hl}" fill="none" stroke="#fff6e4" stroke-width="1.6" opacity=".9"/>`;
}

/* ============================================================ LAYOUT */
function layout() {
  const sw = stage.clientWidth, sh = stage.clientHeight, hh = header.offsetHeight;
  const mobile = sw < 720 || sw / sh < .8;
  let u = mobile ? Math.min(sw / 450, (sh - hh) / 600) : Math.min(sw / 1106, sh / 618);
  u = clamp(u, .4, 2);
  const top = 90, bottom = 610;                      // design-space vertical extent of the hero
  const free = sh - hh - (bottom - top) * u;
  const oy = hh + Math.max(0, free / 2) - top * u + (mobile ? 0 : Math.min(0, free / 2));
  const ox = (sw - 1106 * u) / 2;
  G = { sw, sh, hh, u, ox, oy, mobile, dxScale: mobile ? .8 : 1 };

  const root = document.documentElement.style;
  root.setProperty('--u', u + 'px');
  root.setProperty('--tw', (REF.center.w * u) + 'px');
  root.setProperty('--th', (REF.center.h * u) + 'px');

  hero.style.top = (oy + 97 * u) + 'px';
  Object.assign(shelf.style, { left: ox + 'px', top: oy + 'px', width: 1106 * u + 'px', height: 618 * u + 'px',
    transform: G.dxScale !== 1 ? `scaleX(${G.dxScale})` : '' });
  const arrowY = oy + 377 * u;
  const ax = mobile ? 26 : Math.max(30, ox + 60 * u);
  prevBtn.style.transform = `translate(${ax}px,${arrowY}px) translate(-50%,-50%)`;
  nextBtn.style.transform = `translate(${sw - ax}px,${arrowY}px) translate(-50%,-50%)`;
  cta.style.top = (oy + 493 * u) + 'px';
  platform.style.top = (oy + 400 * u) + 'px';

  /* book size: one page is W × H; the open spread is 2W wide */
  const maxSpread = sw * (mobile ? .94 : .72);
  let H = Math.min((sh - hh) * .86, maxSpread / 1.5);
  if (!mobile) H = Math.min(H, sh * .75);
  const W = H * .75, D = H * .095, c = Math.max(1.5, H * .006), m = H * .027, L0 = D * .42, dl = D * .06;
  const cy = Math.max(hh + 14 + H / 2, sh * .525);
  /* a closed book is only one page wide, so on narrow screens it can be shown larger than the spread */
  const closedScale = Math.max(1, Math.min(1.6, sw * .78 / W, (sh - hh) * .8 / H));
  Object.assign(G, { W, H, D, c, m, L0, dl, cy, closedScale, persp: H * 4.5 });
  const bs = book.style;
  bs.setProperty('--W', W + 'px'); bs.setProperty('--H', H + 'px'); bs.setProperty('--D', D + 'px');
  bs.setProperty('--c', c + 'px'); bs.setProperty('--m', m + 'px'); bs.setProperty('--bu', H / 100 + 'px');
  bs.setProperty('--zb', (D - L0 - 3 * dl) + 'px');
  bs.setProperty('--mv', (H * .014) + 'px');      // cover overhang at top / bottom
  bs.setProperty('--fy', (H * .0055) + 'px');
  anchor.style.top = cy + 'px';
  anchor.style.perspective = G.persp + 'px';

  /* scale at which the closed book exactly covers the centre tile (with perspective compensation) */
  const zFront = (D / 2 + c);
  const s0raw = (REF.center.w * u) / W;
  G.s0 = s0raw / (G.persp / (G.persp - zFront * s0raw));

  arc.classList.add('no-anim');
  layoutTiles(0);
  arc.offsetWidth; arc.classList.remove('no-anim');
  lastP = -1;
}

/* ============================================================ SCROLL → PROGRESS */
const distance = () => journey.offsetHeight - stage.offsetHeight;
const targetProgress = () => clamp((scrollY - journey.offsetTop) / distance());
const scrollToProgress = p => scrollTo({ top: journey.offsetTop + p * distance(), behavior: reduceMotion ? 'auto' : 'smooth' });
function startJourney() { scrollToProgress(TL.grow[1] + .015); }
$('explore').addEventListener('click', startJourney);
backTo.addEventListener('click', () => scrollToProgress(0));
$('footerBack').addEventListener('click', () => scrollToProgress(0));

/* finish a half-done page turn in the direction the user was scrolling */
let lastY = scrollY, dir = 1, idle = 0, touching = false;
addEventListener('touchstart', () => touching = true, { passive: true });
addEventListener('touchend', () => { touching = false; clearTimeout(idle); idle = setTimeout(settle, 220); }, { passive: true });
addEventListener('scroll', () => {
  const y = scrollY; if (y !== lastY) dir = Math.sign(y - lastY); lastY = y;
  clearTimeout(idle); idle = setTimeout(settle, 170);
}, { passive: true });
function settle() {
  if (!SNAP || touching) return;
  const p = targetProgress();
  if (p <= 0 || p >= 1) return;
  for (const [a, b] of TRANSITIONS) {
    if (p > a + .003 && p < b - .003) { scrollToProgress(clamp(dir >= 0 ? b + .015 : a - .015)); return; }
  }
}

/* ============================================================ RENDER */
let shown = 0, lastP = -1, lastT = performance.now();
function frame(now) {
  const target = targetProgress();
  const dt = Math.min(64, now - lastT); lastT = now;
  shown = reduceMotion ? target : shown + (target - shown) * (1 - Math.pow(1 - .16, dt / 16.7));
  if (Math.abs(target - shown) < .00005) shown = target;
  if (Math.abs(shown - lastP) > .00001) { render(shown); lastP = shown; }
  requestAnimationFrame(frame);
}

function setLeaf(el, t, z0, axis) {
  el.style.transform = `translateZ(${axis.toFixed(2)}px) rotateY(${(-180 * t).toFixed(3)}deg) translateZ(${(z0 - axis).toFixed(2)}px)`;
  el.style.setProperty('--shade', (Math.sin(Math.PI * t) * .5).toFixed(3));
}

function render(p) {
  const { u, W, D, c, L0, dl } = G;

  /* --- hero out --- */
  const fade = seg(p, [0, .045]);
  const heroOn = fade < .5;
  hero.style.opacity = 1 - fade;
  hero.style.transform = `translateY(${(-fade * 24 * u).toFixed(2)}px)`;
  cta.style.opacity = prevBtn.style.opacity = nextBtn.style.opacity = 1 - fade;
  cta.style.visibility = prevBtn.style.visibility = nextBtn.style.visibility = fade >= 1 ? 'hidden' : '';
  cta.style.pointerEvents = heroOn ? '' : 'none';
  prevBtn.style.pointerEvents = nextBtn.style.pointerEvents = heroOn ? '' : 'none';
  arc.classList.toggle('locked', !heroOn);
  const bl = seg(p, [0, .08]);
  arc.style.filter = bl > 0 ? `blur(${(bl * 6 * u).toFixed(2)}px) saturate(${(1 - .2 * bl).toFixed(3)})` : '';
  arc.style.opacity = 1 - .55 * bl;
  shelf.style.opacity = 1 - seg(p, [0, .07]);
  platform.style.opacity = seg(p, [.02, .1]);
  const active = p > .0015;
  arc.classList.toggle('handoff', active);

  /* --- book --- */
  book.style.visibility = active ? 'visible' : 'hidden';
  const gr = ease(seg(p, TL.grow)), o = ease(seg(p, TL.open));
  const a1 = ease(seg(p, TL.l1)), a2 = ease(seg(p, TL.l2)), a3 = ease(seg(p, TL.l3));
  const cl = ease(seg(p, TL.close));
  const tp = pose(0);
  const tx = lerp(tp.x - G.sw / 2, 0, gr), ty = lerp(tp.y - G.cy, 0, gr);
  const s = lerp(lerp(lerp(G.s0, G.closedScale, gr), 1, o), G.closedScale, cl);
  const RX = 13, RY = 19, RXO = 9;
  let rx = lerp(0, RX, gr), ry = lerp(0, RY, gr);
  rx = lerp(rx, RXO, o); ry = lerp(ry, 0, o);
  rx = lerp(rx, RX, cl); ry = lerp(ry, -RY, cl);
  const lift = Math.sin(Math.PI * o) * .025 + Math.sin(Math.PI * cl) * .025;  // tiny "breath" while it opens / closes
  const sh = lerp(lerp(-W / 2, 0, o), W / 2, cl);
  book.style.transform = `translate3d(${tx.toFixed(2)}px,${ty.toFixed(2)}px,0) scale(${(s * (1 - lift)).toFixed(4)}) rotateX(${rx.toFixed(3)}deg) rotateY(${ry.toFixed(3)}deg) translate3d(${sh.toFixed(2)}px,0,${(-D / 2).toFixed(2)}px)`;

  /* page-block thickness: a chunk (L0) of pages goes over with the cover, then each leaf moves dl */
  const flipped = a1 + a2 + a3;
  const sink = L0 * seg(o, [0, .5]);                 // right stack drops while the cover lifts…
  book.style.setProperty('--tR', Math.max(0, D - sink - flipped * dl).toFixed(2) + 'px');
  const tR = Math.max(0, D - sink - flipped * dl), tL = L0 * seg(o, [.5, 1]) + flipped * dl;   // …and lands on the left
  book.style.setProperty('--tL', tL.toFixed(2) + 'px');
  book.classList.toggle('no-left', tL < .5);
  book.classList.toggle('no-right', tR < .5);
  const fan = G.H * .026;                                     // how far the lowest sheet peeks out
  book.style.setProperty('--fxL', (fan * clamp(tL / (D * .5))).toFixed(2) + 'px');
  book.style.setProperty('--fxR', (fan * clamp(tR / (D * .5))).toFixed(2) + 'px');
  const ax = (D + dl) / 2;
  setLeaf(leaves[0], o, D + c, (D + c) / 2);                       // cover board lands at z = 0, under the pages
  leaves[0].style.setProperty('--es', Math.max(.5, L0 * seg(o, [.5, 1])).toFixed(2) + 'px');
  setLeaf(leaves[1], a1, D - sink, ax);
  setLeaf(leaves[2], a2, D - sink - dl, ax);
  setLeaf(leaves[3], a3, D - sink - 2 * dl, ax);
  setLeaf(baseLeaf, cl, 0, D / 2 + .6);
  spineF.style.opacity = 1 - seg(o, [0, .35]);
  spineB.style.opacity = seg(cl, [.6, 1]);

  book.classList.toggle('interactive', p > TL.l3[1] - .005 && p < TL.close[0] + .01);
  backTo.classList.toggle('show', p > TL.close[1] + .02 && p < .999);
}

/* ============================================================ INIT */
buildShelf();
fillBook(selected);
layout();
live.textContent = BOOKS[selected].title;
addEventListener('resize', () => { clearTimeout(layout._t); layout._t = setTimeout(layout, 80); });
shown = targetProgress();
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
